name: sccache A/B (PR 10154)

on:
  pull_request:
    branches: [master]

concurrency:
  group: sccache-ab-pr-10154-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  github-seed:
    name: GitHub-hosted cold seed
    if: ${{ github.event.pull_request.number == 10154 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Expose GitHub cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Seed GitHub-hosted namespace
        run: bash scripts/ci/run_sccache_ab.sh seed zeroclaw-pr10154-ab-github-v1

  github-reader:
    name: GitHub-hosted warm reader
    needs: [github-seed]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Expose GitHub cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Read GitHub-hosted namespace
        run: bash scripts/ci/run_sccache_ab.sh reader zeroclaw-pr10154-ab-github-v1

  blacksmith-seed:
    name: Blacksmith cold seed
    if: ${{ github.event.pull_request.number == 10154 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Expose GitHub cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Seed Blacksmith namespace
        run: bash scripts/ci/run_sccache_ab.sh seed zeroclaw-pr10154-ab-blacksmith-v1

  blacksmith-reader:
    name: Blacksmith warm reader
    needs: [blacksmith-seed]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
      - name: Expose GitHub cache credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Read Blacksmith namespace
        run: bash scripts/ci/run_sccache_ab.sh reader zeroclaw-pr10154-ab-blacksmith-v1
